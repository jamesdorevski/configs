# Fix Colors
set -g default-terminal "screen-256color" 
set-option -sa terminal-overrides ",xterm-256color:RGB"

# Scrolling
setw -g mouse on

# Statusline Colors
set -g status-style bg=terminal,fg=terminal

# Statusline location
set -g status-position bottom

# Current window name bold
set -g window-status-current-style fg=terminal,bold

# Compact window names so more tabs fit before overflowing
set -g window-status-format "#I:#{=20:window_name}#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:#{=20:window_name}#{?window_flags,#{window_flags}, }"

# Stack window tabs across rows instead of overflowing to the right.
# psmux reports an X.Y.Z version and has no status-format option, so it skips this.
%if "#{==:#{m:*.*.*,#{version}},0}"
#set -g @tab-cols 6
#set -g @tab-rows 2
#set -g status 3
#set -g status-format[0] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#{W:#{?#{==:#{e|m:#{e|/:#{window_index},#{@tab-cols}},#{@tab-rows}},0},#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{window-status-separator},},#{?#{==:#{e|m:#{e|/:#{window_index},#{@tab-cols}},#{@tab-rows}},0},#[range=window|#{window_index} #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]#{window-status-separator},}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
#set -g status-format[1] '#[align=left]#{W:#{?#{==:#{e|m:#{e|/:#{window_index},#{@tab-cols}},#{@tab-rows}},1},#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{window-status-separator},},#{?#{==:#{e|m:#{e|/:#{window_index},#{@tab-cols}},#{@tab-rows}},1},#[range=window|#{window_index} #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]#{window-status-separator},}}'
#set -g status-format[2] '#[align=left]#{W:#{?#{==:#{e|m:#{e|/:#{window_index},#{@tab-cols}},#{@tab-rows}},2},#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{window-status-separator},},#{?#{==:#{e|m:#{e|/:#{window_index},#{@tab-cols}},#{@tab-rows}},2},#[range=window|#{window_index} #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]#{window-status-separator},}}'
%endif

# Time settings
#set -g status-right "%H:%M, %d-%b-%y, %a"
set -g status-right ""

# Increase left length
set -g status-left-length 20

# Enable vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Claude Code
set -g focus-events on

## Launch a new Claude Code session in a new window
bind C new-window -c "#{pane_current_path}" "claude"

## tmux settings
set -g allow-predictions on
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'
